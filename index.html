<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Chef AI | Budget & Zero-Waste</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background-color: #fffaf5; }
        .checked-text { text-decoration: line-through; opacity: 0.5; color: #9ca3af; }
        .prose li { 
            list-style-type: none; display: flex; align-items: center; justify-content: space-between; 
            margin-bottom: 0.5rem; padding: 0.75rem; background: white; border-radius: 16px; border: 1px solid #fed7aa;
        }
        .add-btn { cursor: pointer; background: #ea580c; color: white; border-radius: 10px; padding: 4px 10px; font-size: 12px; font-weight: bold; transition: all 0.2s; }
        .zero-waste-active { background-color: #16a34a !important; color: white !important; border-color: #15803d !important; box-shadow: 0 0 15px rgba(22, 163, 74, 0.1); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen p-4 pb-24 text-gray-800">

    <div class="max-w-md mx-auto">
        
        <div class="text-center mb-10 pt-6">
            <div class="inline-block p-4 bg-white rounded-3xl shadow-sm border border-orange-100 mb-4">
                <span class="text-5xl">🥗</span>
            </div>
            <h1 class="text-4xl font-extrabold text-orange-600 tracking-tighter">FamilyChef<span class="text-orange-400">AI</span></h1>
            <p class="text-sm text-orange-400 mt-1 font-medium italic text-center">Reste essen, aber in lecker.</p>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-orange-100/50 p-8 border border-orange-50 mb-8">
            
            <div class="mb-6">
                <div class="relative w-full h-32 bg-orange-50 rounded-3xl border-2 border-dashed border-orange-200 flex flex-col items-center justify-center overflow-hidden cursor-pointer hover:bg-orange-100/50 transition-colors" onclick="document.getElementById('fileInput').click()">
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover">
                    <div id="uploadPlaceholder" class="text-center">
                        <span class="text-3xl text-orange-300">📸</span>
                        <p class="text-[11px] font-bold text-orange-400 mt-1 uppercase tracking-wider">Zutaten scannen</p>
                    </div>
                </div>
                <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="previewImage(this)">
                <button id="removeImage" class="hidden w-full mt-2 text-[10px] text-red-400 font-bold uppercase" onclick="resetImage()">Foto entfernen ✕</button>
            </div>

            <div class="relative mb-4">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-xl">🥕</span>
                <input type="text" id="ingredients" class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-orange-400 transition-all" placeholder="Was muss weg?">
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-50 p-3 rounded-2xl">
                    <label class="block text-[10px] font-bold text-orange-400 uppercase mb-1 ml-1">👨 Erwachsene</label>
                    <input type="number" id="adults" value="2" class="w-full bg-transparent font-bold outline-none text-lg">
                </div>
                <div class="bg-gray-50 p-3 rounded-2xl">
                    <label class="block text-[10px] font-bold text-orange-400 uppercase mb-1 ml-1">👶 Kinder</label>
                    <input type="number" id="children" value="2" class="w-full bg-transparent font-bold outline-none text-lg">
                </div>
            </div>

            <div class="flex gap-2 mb-6 bg-gray-100 p-1.5 rounded-2xl">
                <button id="modeDay" onclick="setMode('day')" class="flex-1 py-2.5 rounded-xl bg-white shadow-sm font-bold text-orange-600 text-xs transition-all">Heute 🍳</button>
                <button id="modeWeek" onclick="setMode('week')" class="flex-1 py-2.5 rounded-xl text-gray-500 font-medium text-xs transition-all">Woche 📅</button>
                <button id="zeroWasteBtn" onclick="toggleZeroWaste()" class="flex-1 py-2.5 rounded-xl text-gray-500 font-bold text-xs transition-all border border-transparent">Zero-Waste 🌱</button>
            </div>

            <div id="startDayContainer" class="hidden mb-6">
                <select id="startDay" class="w-full p-4 bg-gray-50 rounded-2xl outline-none font-semibold text-gray-600">
                    <option>Montag</option><option>Dienstag</option><option>Mittwoch</option><option>Donnerstag</option><option>Freitag</option><option>Samstag</option><option>Sonntag</option>
                </select>
            </div>

            <button onclick="getRecipe()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-5 rounded-2xl shadow-xl hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3">
                <span class="text-lg">Rezept zaubern</span> <span class="text-xl animate-pulse">🪄</span>
            </button>
        </div>

        <div id="loader" class="hidden text-center p-12">
            <div class="inline-block animate-bounce text-6xl">🥕</div>
            <p class="text-orange-500 font-bold mt-4 tracking-widest text-xs uppercase">Berechne Budget & Rezept...</p>
        </div>

        <div id="resultCard" class="hidden bg-white rounded-[2.5rem] shadow-2xl p-8 border border-orange-50 mb-8 animate-fadeIn">
            
            <div id="budgetDisplay" class="hidden mb-6 p-4 bg-orange-50 rounded-2xl border border-orange-100 flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-bold text-orange-400 uppercase tracking-widest">Budget-Check 2026</p>
                    <p id="totalPrice" class="text-xl font-extrabold text-gray-800">-- €</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-orange-400 uppercase tracking-widest">Pro Person</p>
                    <p id="perPersonPrice" class="text-sm font-bold text-gray-600">-- €</p>
                </div>
            </div>

            <div id="result" class="prose prose-orange text-sm mb-8 max-w-none"></div>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="saveRecipe()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-all">⭐ Merken</button>
                <button onclick="downloadPDF()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-all">📥 PDF</button>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-xl p-8 border border-orange-50 mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-3">🛒 Liste</h2>
            <div id="shoppingList" class="space-y-3"></div>
            <button onclick="clearShoppingList()" id="clearBtn" class="hidden mt-6 text-[10px] text-gray-400 font-bold tracking-widest uppercase w-full text-center">Leeren</button>
        </div>

        <div class="mb-20">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-3">📖 Kochbuch</h2>
            <div id="recipeList" class="space-y-4"></div>
        </div>
    </div>

    <div id="quickAddWindow" class="fixed z-50 bg-white/95 backdrop-blur shadow-2xl rounded-3xl p-6 border border-orange-100 w-72 bottom-6 right-6">
        <div class="flex justify-between items-center mb-4">
            <span class="text-[10px] font-extrabold text-orange-600 uppercase">Quick Add 🛒</span>
            <button onclick="toggleQuickAdd()" class="text-gray-400 font-bold text-lg">✕</button>
        </div>
        <div class="flex gap-2">
            <input type="text" id="quickInput" class="flex-grow p-3 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-300" placeholder="Was fehlt?">
            <button onclick="addFromQuick()" class="bg-orange-500 text-white p-3 rounded-xl font-bold hover:bg-orange-600 transition-all">+</button>
        </div>
    </div>
    <button id="openQuickBtn" onclick="toggleQuickAdd()" class="hidden fixed bottom-6 right-6 bg-orange-600 text-white w-16 h-16 rounded-full shadow-2xl z-50 flex items-center justify-center text-2xl">🛒</button>

    <script>
        let base64Image = null;
        let isWeeklyMode = false;
        let isZeroWaste = false;

        function setMode(mode) {
            isWeeklyMode = (mode === 'week');
            document.getElementById('startDayContainer').classList.toggle('hidden', !isWeeklyMode);
            document.getElementById('modeDay').className = isWeeklyMode ? "flex-1 py-2.5 text-gray-500 text-xs" : "flex-1 py-2.5 bg-white shadow-sm font-bold text-orange-600 rounded-xl text-xs transition-all";
            document.getElementById('modeWeek').className = isWeeklyMode ? "flex-1 py-2.5 bg-white shadow-sm font-bold text-orange-600 rounded-xl text-xs transition-all" : "flex-1 py-2.5 text-gray-500 text-xs";
        }

        function toggleZeroWaste() {
            isZeroWaste = !isZeroWaste;
            document.getElementById('zeroWasteBtn').classList.toggle('zero-waste-active', isZeroWaste);
        }

        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    base64Image = e.target.result;
                    document.getElementById('imagePreview').src = base64Image;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('removeImage').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function resetImage() {
            base64Image = null;
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('removeImage').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        async function getRecipe() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('budgetDisplay').classList.add('hidden');
            
            const budgetPrompt = ". Berechne zusätzlich die geschätzten Kosten für die benötigten Mengen in Euro (deutsche Supermarktpreise März 2026). Schreibe ganz am Ende NUR: [PRICE: XX.XX]";
            const zw = isZeroWaste ? ". NUTZE ALLE ZUTATEN RESTLOS (Zero-Waste)." : "";

            try {
                const response = await fetch('http://127.0.0.1:8000/generate-recipe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ingredients: [document.getElementById('ingredients').value + zw + budgetPrompt],
                        image_data: base64Image,
                        adults: parseInt(document.getElementById('adults').value),
                        children: parseInt(document.getElementById('children').value),
                        is_weekly_plan: isWeeklyMode,
                        start_day: document.getElementById('startDay').value
                    })
                });
                const data = await response.json();
                let recipeText = data.recipe;

                // Preis-Extraktion
                const priceMatch = recipeText.match(/\[PRICE: (\d+\.\d+)\]/);
                if (priceMatch) {
                    const total = parseFloat(priceMatch[1]);
                    const persons = parseInt(document.getElementById('adults').value) + parseInt(document.getElementById('children').value);
                    document.getElementById('totalPrice').innerText = total.toFixed(2) + " €";
                    document.getElementById('perPersonPrice').innerText = (total / (persons || 1)).toFixed(2) + " €";
                    document.getElementById('budgetDisplay').classList.remove('hidden');
                    recipeText = recipeText.replace(/\[PRICE: \d+\.\d+\]/, "");
                }

                document.getElementById('result').innerHTML = marked.parse(recipeText);
                document.getElementById('resultCard').classList.remove('hidden');
                addShoppingButtons();
                window.scrollTo({ top: document.getElementById('resultCard').offsetTop - 20, behavior: 'smooth' });
            } catch (e) { alert("Server?"); }
            finally { document.getElementById('loader').classList.add('hidden'); }
        }

        function addShoppingButtons() {
            document.querySelectorAll('#result li').forEach(li => {
                const text = li.innerText;
                li.innerHTML = `<span class="flex-grow pr-4 text-gray-700 font-medium">${text}</span> <button class="add-btn" onclick="addToShoppingList('${text}')">🛒+</button>`;
            });
        }

        function addToShoppingList(item) {
            const list = JSON.parse(localStorage.getItem('shoppingList') || '[]');
            list.push({ id: Date.now(), text: item, checked: false });
            localStorage.setItem('shoppingList', JSON.stringify(list));
            renderShoppingList();
        }

        function renderShoppingList() {
            const list = JSON.parse(localStorage.getItem('shoppingList') || '[]');
            document.getElementById('clearBtn').classList.toggle('hidden', list.length === 0);
            document.getElementById('shoppingList').innerHTML = list.map(item => `
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl border border-orange-50 mb-2 shadow-sm transition-all hover:bg-white">
                    <span onclick="toggleItem(${item.id})" class="text-sm font-semibold cursor-pointer flex-grow ${item.checked ? 'checked-text' : 'text-gray-700'}">
                        ${item.checked ? '✅' : '▢'} ${item.text}
                    </span>
                    <button onclick="removeItem(${item.id})" class="text-gray-300 hover:text-red-400 ml-4 transition-colors">✕</button>
                </div>
            `).join('') || '<p class="text-xs text-center text-gray-400 italic py-4">Liste ist leer.</p>';
        }

        function toggleItem(id) {
            let list = JSON.parse(localStorage.getItem('shoppingList'));
            list = list.map(i => i.id === id ? {...i, checked: !i.checked} : i);
            localStorage.setItem('shoppingList', JSON.stringify(list));
            renderShoppingList();
        }

        function removeItem(id) {
            let list = JSON.parse(localStorage.getItem('shoppingList'));
            localStorage.setItem('shoppingList', JSON.stringify(list.filter(i => i.id !== id)));
            renderShoppingList();
        }

        function clearShoppingList() { localStorage.setItem('shoppingList', '[]'); renderShoppingList(); }

        function saveRecipe() {
            const content = document.getElementById('result').innerHTML;
            const saved = JSON.parse(localStorage.getItem('myRecipes') || '[]');
            saved.push({ id: Date.now(), name: (isWeeklyMode ? "📅 Woche " : "🍳 Rezept ") + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), content: content, date: new Date().toLocaleDateString() });
            localStorage.setItem('myRecipes', JSON.stringify(saved));
            renderRecipeList();
        }

        function renderRecipeList() {
            const saved = JSON.parse(localStorage.getItem('myRecipes') || '[]');
            document.getElementById('recipeList').innerHTML = saved.map(r => `
                <div class="bg-white p-5 rounded-[2rem] border border-orange-50 flex justify-between items-center shadow-md hover:shadow-lg transition-all mb-3">
                    <div onclick="showSavedRecipe(${r.id})" class="cursor-pointer flex-grow">
                        <p class="font-bold text-orange-600 text-sm tracking-tight">${r.name}</p>
                        <p class="text-[10px] text-gray-400 font-bold uppercase mt-1 tracking-widest">${r.date}</p>
                    </div>
                    <button onclick="deleteRecipe(${r.id})" class="text-gray-200 hover:text-red-400 transition-colors p-2 text-xl">🗑️</button>
                </div>
            `).join('') || '<p class="text-xs text-center text-gray-400 italic py-4">Noch keine Rezepte gesichert.</p>';
        }

        function deleteRecipe(id) {
            let saved = JSON.parse(localStorage.getItem('myRecipes'));
            localStorage.setItem('myRecipes', JSON.stringify(saved.filter(r => r.id !== id)));
            renderRecipeList();
        }

        function showSavedRecipe(id) {
            const r = JSON.parse(localStorage.getItem('myRecipes')).find(recipe => recipe.id === id);
            document.getElementById('result').innerHTML = r.content;
            document.getElementById('resultCard').classList.remove('hidden');
            addShoppingButtons();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function toggleQuickAdd() {
            const win = document.getElementById('quickAddWindow');
            const btn = document.getElementById('openQuickBtn');
            win.classList.toggle('hidden');
            btn.classList.toggle('hidden', !win.classList.contains('hidden'));
        }

        function addFromQuick() {
            const input = document.getElementById('quickInput');
            if(input.value.trim()) { addToShoppingList(input.value.trim()); input.value = ''; }
        }

        function downloadPDF() { html2pdf().from(document.getElementById('result')).save('FamilyChef_Rezept.pdf'); }

        window.onload = () => { renderRecipeList(); renderShoppingList(); };
    </script>
</body>
</html>
