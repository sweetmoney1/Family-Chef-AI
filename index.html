<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Chef AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background-color: #fffaf5; }
        .checked-text { text-decoration: line-through; opacity: 0.5; color: #9ca3af; }
        .prose li { list-style-type: none; display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; padding: 0.75rem; background: white; border-radius: 16px; border: 1px solid #fed7aa; }
        .add-btn { cursor: pointer; background: #ea580c; color: white; border-radius: 10px; padding: 4px 10px; font-size: 12px; font-weight: bold; }
        .zero-waste-active { background-color: #16a34a !important; color: white !important; border-color: #15803d !important; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen p-4 pb-24 text-gray-800">
    <div class="max-w-md mx-auto">
        <div class="flex justify-end mb-4">
            <button onclick="toggleSettings()" class="bg-white p-3 rounded-2xl shadow-sm border border-orange-100 text-xl shadow-sm active:scale-90 transition-all">⚙️</button>
        </div>
        <div id="settingsPanel" class="hidden bg-white rounded-[2rem] p-6 shadow-xl border border-orange-100 mb-8 animate-fadeIn text-center">
            <h3 class="font-bold text-orange-600 uppercase text-xs mb-2 tracking-widest">API Einstellungen 🛡️</h3>
            <p class="text-[10px] text-gray-400 mb-4">Dein Key wird nur lokal in deinem Browser gespeichert.</p>
            <input type="password" id="apiKeyInput" class="w-full p-4 bg-gray-50 rounded-2xl text-sm outline-none border border-orange-50 mb-4 focus:ring-2 focus:ring-orange-400" placeholder="sk-...">
            <button onclick="saveApiKey()" class="w-full bg-orange-600 text-white font-bold py-3 rounded-2xl text-xs uppercase tracking-widest">Key Speichern</button>
        </div>

        <div class="text-center mb-10 pt-2">
            <div class="inline-block p-4 bg-white rounded-3xl shadow-sm border border-orange-100 mb-4"><span class="text-5xl">🥗</span></div>
            <h1 class="text-4xl font-extrabold text-orange-600 tracking-tighter">FamilyChef<span class="text-orange-400">AI</span></h1>
            <p class="text-sm text-orange-400 mt-1 font-medium italic">Reste essen, aber in lecker.</p>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-2xl p-8 border border-orange-50 mb-8">
            <div class="mb-6">
                <div class="relative w-full h-32 bg-orange-50 rounded-3xl border-2 border-dashed border-orange-200 flex flex-col items-center justify-center overflow-hidden cursor-pointer" onclick="document.getElementById('fileInput').click()">
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover">
                    <div id="uploadPlaceholder" class="text-center"><span class="text-3xl text-orange-300">📸</span><p class="text-[11px] font-bold text-orange-400 mt-1 uppercase">Zutaten scannen</p></div>
                </div>
                <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="previewImage(this)">
                <button id="removeImage" class="hidden w-full mt-2 text-[10px] text-red-400 font-bold uppercase" onclick="resetImage()">✕ Entfernen</button>
            </div>
            <div class="relative mb-4">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-xl">🥕</span>
                <input type="text" id="ingredients" class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-orange-400" placeholder="Was muss weg?">
            </div>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-50 p-3 rounded-2xl"><label class="text-[10px] font-bold text-orange-400 uppercase">👨 Erw.</label><input type="number" id="adults" value="2" class="w-full bg-transparent font-bold outline-none text-lg"></div>
                <div class="bg-gray-50 p-3 rounded-2xl"><label class="text-[10px] font-bold text-orange-400 uppercase">👶 Kind</label><input type="number" id="children" value="2" class="w-full bg-transparent font-bold outline-none text-lg"></div>
            </div>
            <div class="flex gap-2 mb-6 bg-gray-100 p-1.5 rounded-2xl">
                <button id="modeDay" onclick="setMode('day')" class="flex-1 py-2.5 rounded-xl bg-white shadow-sm font-bold text-orange-600 text-xs">Heute</button>
                <button id="modeWeek" onclick="setMode('week')" class="flex-1 py-2.5 rounded-xl text-gray-500 text-xs">Woche</button>
                <button id="zeroWasteBtn" onclick="toggleZeroWaste()" class="flex-1 py-2.5 rounded-xl text-gray-500 font-bold text-xs">Zero-Waste</button>
            </div>
            <button onclick="getRecipe()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-5 rounded-2xl shadow-xl flex items-center justify-center gap-3 transition-all active:scale-95">Rezept zaubern 🪄</button>
        </div>

        <div id="loader" class="hidden text-center p-12"><div class="animate-bounce text-6xl">🥕</div><p class="text-orange-500 font-bold mt-4 tracking-widest text-xs uppercase">KI kocht gerade...</p></div>

        <div id="resultCard" class="hidden bg-white rounded-[2.5rem] shadow-2xl p-8 border border-orange-50 mb-8 animate-fadeIn">
            <div id="budgetDisplay" class="hidden mb-6 p-4 bg-orange-50 rounded-2xl border border-orange-100 flex items-center justify-between">
                <div><p class="text-[10px] font-bold text-orange-400 uppercase">Gesamtpreis</p><p id="totalPrice" class="text-xl font-extrabold text-gray-800">-- €</p></div>
                <div class="text-right"><p class="text-[10px] font-bold text-orange-400 uppercase">Pro Kopf</p><p id="perPersonPrice" class="text-sm font-bold text-gray-600">-- €</p></div>
            </div>
            <div id="result" class="prose prose-orange text-sm mb-8 max-w-none"></div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="saveRecipe()" class="bg-green-500 text-white font-bold py-4 rounded-2xl text-xs shadow-lg shadow-green-100">⭐ Merken</button>
                <button onclick="downloadPDF()" class="bg-blue-500 text-white font-bold py-4 rounded-2xl text-xs shadow-lg shadow-blue-100">📥 PDF</button>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-xl p-8 border border-orange-50 mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-3">🛒 Liste</h2>
            <div id="shoppingList" class="space-y-3"></div>
            <button onclick="copyListToClipboard()" class="mt-4 w-full text-[10px] text-orange-500 font-bold uppercase tracking-widest py-2 border border-orange-100 rounded-xl active:bg-orange-50 transition-all">Liste kopieren 📋</button>
        </div>

        <div class="mb-20 px-2">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-3">📖 Kochbuch</h2>
            <div id="recipeList" class="space-y-4"></div>
        </div>
    </div>

    <div id="quickAddWindow" class="fixed z-50 bg-white/95 backdrop-blur shadow-2xl rounded-3xl p-6 border border-orange-100 w-72 bottom-6 right-6 hidden animate-fadeIn">
        <div class="flex justify-between items-center mb-4"><span class="text-[10px] font-extrabold text-orange-600 uppercase tracking-widest">Schnell-Add</span><button onclick="toggleQuickAdd()" class="text-gray-400 font-bold">✕</button></div>
        <div class="flex gap-2">
            <input type="text" id="quickInput" class="flex-grow p-3 bg-gray-50 rounded-xl text-sm outline-none border border-orange-50" placeholder="Was fehlt?">
            <button onclick="addFromQuick()" class="bg-orange-500 text-white px-4 rounded-xl font-bold">+</button>
        </div>
    </div>
    <button id="openQuickBtn" onclick="toggleQuickAdd()" class="fixed bottom-6 right-6 bg-orange-600 text-white w-16 h-16 rounded-full shadow-2xl z-50 flex items-center justify-center text-2xl hover:scale-110 active:scale-90 transition-all">🛒</button>

    <script>
        let base64Image = null, isWeeklyMode = false, isZeroWaste = false;

        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('hidden'); }
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key.startsWith('sk-')) { localStorage.setItem('familyChefApiKey', key); alert("Key gesichert! 🛡️"); toggleSettings(); }
            else { alert("Bitte einen gültigen OpenAI Key eingeben."); }
        }

        function setMode(mode) {
            isWeeklyMode = (mode === 'week');
            document.getElementById('modeDay').className = isWeeklyMode ? "flex-1 py-2.5 text-gray-500 text-xs" : "flex-1 py-2.5 bg-white shadow-sm font-bold text-orange-600 rounded-xl text-xs";
            document.getElementById('modeWeek').className = isWeeklyMode ? "flex-1 py-2.5 bg-white shadow-sm font-bold text-orange-600 rounded-xl text-xs" : "flex-1 py-2.5 text-gray-500 text-xs";
        }

        function toggleZeroWaste() {
            isZeroWaste = !isZeroWaste;
            document.getElementById('zeroWasteBtn').classList.toggle('zero-waste-active', isZeroWaste);
        }

        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    base64Image = e.target.result;
                    document.getElementById('imagePreview').src = base64Image;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('removeImage').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }
        function resetImage() {
            base64Image = null; document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('removeImage').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        async function getRecipe() {
            const apiKey = localStorage.getItem('familyChefApiKey');
            if(!apiKey) { alert("Bitte erst Key über ⚙️ eingeben!"); toggleSettings(); return; }

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('budgetDisplay').classList.add('hidden');

            const promptText = document.getElementById('ingredients').value + (isZeroWaste ? ". Zero-Waste!" : "") + ". Schätze am Ende Gesamtkosten in Euro (2026). Format: [PRICE: XX.XX]";
            
            try {
                // DIREKT AN OPENAI - KEIN LOKALER SERVER!
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [
                            { role: "system", content: "Du bist ein Familienkoch. Markdown nutzen." },
                            { role: "user", content: base64Image ? [{type: "text", text: promptText}, {type: "image_url", image_url: {url: base64Image}}] : promptText }
                        ]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                let recipeText = data.choices[0].message.content;

                const priceMatch = recipeText.match(/\[PRICE: (\d+[\.,]\d+)\]/);
                if (priceMatch) {
                    const total = parseFloat(priceMatch[1].replace(',', '.'));
                    const persons = (parseInt(document.getElementById('adults').value) || 0) + (parseInt(document.getElementById('children').value) || 0);
                    document.getElementById('totalPrice').innerText = total.toFixed(2) + " €";
                    document.getElementById('perPersonPrice').innerText = (total / (persons || 1)).toFixed(2) + " €";
                    document.getElementById('budgetDisplay').classList.remove('hidden');
                    recipeText = recipeText.replace(/\[PRICE: \d+[\.,]\d+\]/, "");
                }

                document.getElementById('result').innerHTML = marked.parse(recipeText);
                document.getElementById('resultCard').classList.remove('hidden');
                addShoppingButtons();
                window.scrollTo({ top: document.getElementById('resultCard').offsetTop - 20, behavior: 'smooth' });

            } catch (e) { 
                alert("Fehler: " + e.message); 
            } finally { 
                document.getElementById('loader').classList.add('hidden'); 
            }
        }

        function addShoppingButtons() { document.querySelectorAll('#result li').forEach(li => { const t = li.innerText; li.innerHTML = `<span class="flex-grow pr-4">${t}</span> <button class="add-btn" onclick="addToShoppingList('${t}')">🛒+</button>`; }); }
        function addToShoppingList(item) { const list = JSON.parse(localStorage.getItem('shoppingList') || '[]'); list.push({ id: Date.now(), text: item, checked: false }); localStorage.setItem('shoppingList', JSON.stringify(list)); renderShoppingList(); }
        function renderShoppingList() { const list = JSON.parse(localStorage.getItem('shoppingList') || '[]'); document.getElementById('shoppingList').innerHTML = list.map(item => `<div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl mb-2"><span onclick="toggleItem(${item.id})" class="text-sm font-semibold cursor-pointer ${item.checked ? 'checked-text' : ''}">${item.checked ? '✅' : '▢'} ${item.text}</span><button onclick="removeItem(${item.id})" class="text-gray-300 ml-4">✕</button></div>`).join('') || '<p class="text-xs text-center text-gray-400 py-4 italic">Liste leer.</p>'; }
        function toggleItem(id) { let list = JSON.parse(localStorage.getItem('shoppingList')); list = list.map(i => i.id === id ? {...i, checked: !i.checked} : i); localStorage.setItem('shoppingList', JSON.stringify(list)); renderShoppingList(); }
        function removeItem(id) { let list = JSON.parse(localStorage.getItem('shoppingList')); localStorage.setItem('shoppingList', JSON.stringify(list.filter(i => i.id !== id))); renderShoppingList(); }
        
        function saveRecipe() { const saved = JSON.parse(localStorage.getItem('myRecipes') || '[]'); saved.push({ id: Date.now(), name: "Rezept " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), content: document.getElementById('result').innerHTML, date: new Date().toLocaleDateString() }); localStorage.setItem('myRecipes', JSON.stringify(saved)); renderRecipeList(); alert("Gesichert! ⭐"); }
        function renderRecipeList() { const saved = JSON.parse(localStorage.getItem('myRecipes') || '[]'); document.getElementById('recipeList').innerHTML = saved.map(r => `<div class="bg-white p-5 rounded-[2rem] border border-orange-50 flex justify-between items-center shadow-md mb-3 transition-all active:scale-[0.98]"><div onclick="showSavedRecipe(${r.id})" class="cursor-pointer flex-grow"><p class="font-bold text-orange-600 text-sm">${r.name}</p><p class="text-[10px] text-gray-400 uppercase tracking-widest">${r.date}</p></div><button onclick="deleteRecipe(${r.id})" class="text-gray-200 p-2 text-xl">🗑️</button></div>`).join('') || '<p class="text-xs text-center text-gray-400 py-4 italic">Kochbuch leer.</p>'; }
        function deleteRecipe(id) { let saved = JSON.parse(localStorage.getItem('myRecipes')); localStorage.setItem('myRecipes', JSON.stringify(saved.filter(r => r.id !== id))); renderRecipeList(); }
        function showSavedRecipe(id) { const r = JSON.parse(localStorage.getItem('myRecipes')).find(recipe => recipe.id === id); document.getElementById('result').innerHTML = r.content; document.getElementById('resultCard').classList.remove('hidden'); addShoppingButtons(); window.scrollTo({ top: 0, behavior: "smooth" }); }

        function toggleQuickAdd() { document.getElementById('quickAddWindow').classList.toggle('hidden'); }
        function addFromQuick() { const input = document.getElementById('quickInput'); if(input.value.trim()) { addToShoppingList(input.value.trim()); input.value = ''; } }
        function downloadPDF() { html2pdf().from(document.getElementById('result')).save('FamilyChef_Rezept.pdf'); }
        function copyListToClipboard() { const list = JSON.parse(localStorage.getItem('shoppingList') || '[]'); const text = list.map(i => (i.checked ? '[x] ' : '[ ] ') + i.text).join('\n'); navigator.clipboard.writeText(text); alert("Liste kopiert! 📋"); }

        window.onload = () => { 
            const savedKey = localStorage.getItem('familyChefApiKey');
            if(savedKey) document.getElementById('apiKeyInput').value = savedKey;
            renderRecipeList(); renderShoppingList(); 
        };
    </script>
</body>
</html>
